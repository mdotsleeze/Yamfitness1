<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yam Fitness</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0D0D0D; }
        .wrapper-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
        /* Creates an invisible mask to block the bottom right corner click target zone */
        .badge-mask { 
            position: absolute; 
            bottom: 0; 
            right: 0; 
            width: 180px; 
            height: 50px; 
            background-color: #0D0D0D; 
            z-index: 99999; 
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="wrapper-container">
        <iframe src="https://yam-fitness-flow.base44.app"></iframe>
        <div class="badge-mask"></div>
    </div>
</body>
</html>
