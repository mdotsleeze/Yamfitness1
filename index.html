<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yam Fitness</title>
    <style>
        /* Force body to match layout bounds exactly */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #0D0D0D;
        }

        /* Container scales 50px taller than the viewport screen and hides the overflow clip */
        .app-viewport-container {
            position: relative;
            width: 100vw;
            height: calc(100vh + 50px);
            overflow: hidden;
        }
        
        /* The main app window is stretched past the viewable area, pushing the badge out of site */
        iframe { 
            border: none; 
            width: 100%; 
            height: calc(100% - 50px);
            display: block;
        }
    </style>
</head>
<body>

</body>
</html>
